name: Verify Signal WASM fork

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  wasm-check:
    name: wasm32 build and test compilation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Enforce formatting
        run: cargo fmt --all -- --check
      - name: Compile library and wasm tests
        run: cargo check --locked --target wasm32-unknown-unknown --all-targets
      - name: Lint library and wasm tests
        run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
