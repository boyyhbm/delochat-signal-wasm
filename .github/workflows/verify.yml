name: Verify Signal WASM fork

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  wasm-check:
    name: wasm32 build and test compilation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Install protobuf compiler required by libsignal dependencies
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Compile library and wasm tests
        run: cargo check --locked --target wasm32-unknown-unknown --all-targets
      - name: Lint production library
        run: cargo clippy --locked --target wasm32-unknown-unknown --lib -- -D warnings

  browser-test:
    name: Browser WASM tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install protobuf compiler required by libsignal dependencies
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Run browser tests in Chrome
        run: wasm-pack test --headless --chrome
      - name: Build release WebAssembly package
        run: wasm-pack build --target web --release --out-dir release/pkg --out-name signal_wasm
      - name: Record artifact hashes and source revision
        run: |
          sha256sum release/pkg/signal_wasm.js release/pkg/signal_wasm_bg.wasm > release/pkg/SHA256SUMS
          git rev-parse HEAD > release/pkg/SOURCE_COMMIT
      - name: Upload reproducible browser package
        uses: actions/upload-artifact@v4
        with:
          name: signal-wasm-web-${{ github.sha }}
          path: release/pkg
          if-no-files-found: error
          retention-days: 90
